  <script>
    // --- Web Audio API cho hiệu ứng âm thanh phong phú ---
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playSelect() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(420, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(700, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }
      playScorePing() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        // Hợp âm ding-ding vui nhộn
        const now = this.ctx.currentTime;
        [587.33, 880, 1174.66].forEach((f, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, now + (i * 0.07));
          gain.gain.setValueAtTime(0.4, now + (i * 0.07));
          gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.07) + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + (i * 0.07));
          osc.stop(now + (i * 0.07) + 0.25);
        });
      }
      playWrong() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.linearRampToValueAtTime(140, now + 0.22);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.22);
      }
      playVictory() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        notes.forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freq;
          const startTime = this.ctx.currentTime + (i * 0.1);
          gain.gain.setValueAtTime(0.4, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.4);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.4);
        });
      }
    }

    const sound = new SoundFX();

    // --- State Game ---
    let scoreDuck1 = 0; // Điểm Cột 1 (tối đa 40)
    let scoreDuck2 = 0; // Điểm Cột 3 (tối đa 40)
    let selectedNumber = null;
    // Chú chó đen ở Cột 1 và Cột 3 cùng màu và xếp ở vị trí số 1 (index = 0)
    let specialDuckIdx = 0;
    let isGameActive = false;
    let isGameFinished = false;
    let isTeacherEditMode = false;
    let remainingSeconds = 180; // 3 phút = 180 giây
    let timerInterval = null;

    // DOM Elements
    const startOverlay = document.getElementById('startOverlay');
    const btnStartGame = document.getElementById('btnStartGame');
    const btnEditMode = document.getElementById('btnEditMode');
    const timerBox = document.getElementById('timerBox');
    const timerDisplay = document.getElementById('timerDisplay');
    const duckContainer = document.getElementById('duckContainer');
    const duckContainerRight = document.getElementById('duckContainerRight');
    const numberPool = document.getElementById('numberPool');
    const scoreBoxDuck1 = document.getElementById('scoreBoxDuck1');
    const scoreTextDuck1 = document.getElementById('scoreTextDuck1');
    const scoreBoxDuck2 = document.getElementById('scoreBoxDuck2');
    const scoreTextDuck2 = document.getElementById('scoreTextDuck2');
    const dropzones = document.querySelectorAll('.dropzone');

    // --- Element cho tính năng Bút vẽ ---
    const btnPenMode = document.getElementById('btnPenMode');
    const btnClearCanvas = document.getElementById('btnClearCanvas');
    const drawingCanvas = document.getElementById('drawingCanvas');
    const drawInstruction = document.getElementById('drawInstruction');
    const ctx = drawingCanvas.getContext('2d');
    let isDrawingMode = false;
    let isDrawing = false;
    let lastX = 0;
    let lastY = 0;

    // Hàm thay đổi kích thước canvas
    function resizeCanvas() {
      drawingCanvas.width = window.innerWidth;
      drawingCanvas.height = window.innerHeight;
      ctx.strokeStyle = '#ef4444'; // Màu đỏ nổi bật để khoanh
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Logic vẽ trên canvas
    function getPointerPos(e) {
      return { x: e.clientX, y: e.clientY };
    }

    drawingCanvas.addEventListener('pointerdown', (e) => {
      if (!isDrawingMode) return;
      isDrawing = true;
      const pos = getPointerPos(e);
      lastX = pos.x;
      lastY = pos.y;
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(lastX, lastY);
      ctx.stroke();
    });

    drawingCanvas.addEventListener('pointermove', (e) => {
      if (!isDrawing || !isDrawingMode) return;
      e.preventDefault(); // Ngăn chặn cuộn trang trên mobile khi vẽ
      const pos = getPointerPos(e);
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
      lastX = pos.x;
      lastY = pos.y;
    });

    drawingCanvas.addEventListener('pointerup', () => { isDrawing = false; });
    drawingCanvas.addEventListener('pointercancel', () => { isDrawing = false; });
    drawingCanvas.addEventListener('pointerout', () => { isDrawing = false; });

    // Bật/tắt chế độ bút vẽ
    btnPenMode.addEventListener('click', () => {
      sound.init();
      sound.playSelect();
      isDrawingMode = !isDrawingMode;
      if (isDrawingMode) {
        btnPenMode.classList.remove('bg-blue-400', 'hover:bg-blue-500');
        btnPenMode.classList.add('bg-blue-600', 'ring-4', 'ring-blue-300', 'scale-110');
        drawingCanvas.classList.remove('pointer-events-none');
        drawingCanvas.classList.add('pointer-events-auto');
        drawInstruction.classList.add('hidden'); // Ẩn lời nhắc khi đã cầm bút
      } else {
        btnPenMode.classList.add('bg-blue-400', 'hover:bg-blue-500');
        btnPenMode.classList.remove('bg-blue-600', 'ring-4', 'ring-blue-300', 'scale-110');
        drawingCanvas.classList.add('pointer-events-none');
        drawingCanvas.classList.remove('pointer-events-auto');
      }
    });

    // Xóa toàn bộ nét vẽ
    btnClearCanvas.addEventListener('click', () => {
      sound.init();
      sound.playSelect();
      ctx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
    });

    // Bảng màu các quả bóng số 1, 2, 3, 4
    const numberGradients = {
      '1': 'from-rose-400 to-red-600 border-rose-200',
      '2': 'from-amber-400 to-orange-500 border-amber-200',
      '3': 'from-emerald-400 to-green-600 border-emerald-200',
      '4': 'from-sky-400 to-blue-600 border-sky-200'
    };

    // Hàm xáo trộn lộn xộn mảng số (Fisher-Yates Shuffle)
    function getShuffledNumbers() {
      let arr = ['1', '2', '3', '4'];
      do {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
      } while (arr.join('') === '1234');
      return arr;
    }

    // Render các quả bóng số lộn xộn ở Cột 2
    function renderShuffledNumbers() {
      const shuffled = getShuffledNumbers();
      numberPool.innerHTML = '';
      shuffled.forEach(num => {
        const btn = document.createElement('div');
        btn.setAttribute('draggable', 'true');
        btn.dataset.number = num;
        btn.className = `number-card cursor-pointer active:cursor-grabbing w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-gradient-to-br ${numberGradients[num]} text-white font-black text-3xl sm:text-4xl flex items-center justify-center bubble-shadow border-4 transition-transform hover:scale-110 select-none`;
        btn.textContent = num;

        btn.addEventListener('pointerdown', (e) => {
          if (!isGameActive && !isTeacherEditMode) return;
          if (e.pointerType === 'mouse' && e.button !== 0) return;
          sound.init();
          sound.playSelect();

          if (selectedNumber === num) {
            selectedNumber = null;
            clearSelectedHighlight();
          } else {
            selectedNumber = num;
            clearSelectedHighlight();
            btn.classList.add('selected-ball');
          }
        });

        btn.addEventListener('dragstart', (e) => {
          if (!isGameActive && !isTeacherEditMode) {
            e.preventDefault();
            return;
          }
          sound.init();
          sound.playSelect();
          e.dataTransfer.setData('text/plain', num);
          selectedNumber = num;
          clearSelectedHighlight();
          btn.classList.add('selected-ball');
        });

        numberPool.appendChild(btn);
      });
    }

    // Render đàn gà (3 gà vàng, 1 gà đỏ ở vị trí số 1) hoàn toàn không có chữ chú thích
    function renderAnimals() {
      // CỘT 1: ĐÀN GÀ (hướng nhìn sang phải)
      duckContainer.innerHTML = '';
      for (let i = 0; i < 4; i++) {
        const isSpecial = (i === specialDuckIdx);
        duckContainer.innerHTML += `
          <div class="flex flex-col items-center">
            <div id="${isSpecial ? 'specialDuckLeft' : 'duckLeft_' + i}" class="w-16 h-16 sm:w-20 sm:h-20 p-1 transition-all duration-500 ${isSpecial ? 'bg-amber-50/95 border-2 border-amber-400 shadow-md ring-2 ring-amber-300' : 'bg-white/80 shadow-sm'} rounded-2xl flex items-center justify-center animate-bounce-soft" style="animation-delay: ${i * 0.25}s;">
              ${isSpecial ? getChickenRedSvg(false) : getChickenYellowSvg(false)}
            </div>
          </div>
        `;
      }

      // CỘT 3: ĐÀN GÀ (hướng nhìn sang trái)
      duckContainerRight.innerHTML = '';
      for (let i = 0; i < 4; i++) {
        const isSpecial = (i === specialDuckIdx);
        duckContainerRight.innerHTML += `
          <div class="flex flex-col items-center">
            <div id="${isSpecial ? 'specialDuckRight' : 'duckRight_' + i}" class="w-16 h-16 sm:w-20 sm:h-20 p-1 transition-all duration-500 ${isSpecial ? 'bg-amber-50/95 border-2 border-amber-400 shadow-md ring-2 ring-amber-300' : 'bg-white/80 shadow-sm'} rounded-2xl flex items-center justify-center animate-bounce-soft" style="animation-delay: ${i * 0.25}s;">
              ${isSpecial ? getChickenRedSvg(true) : getChickenYellowSvg(true)}
            </div>
          </div>
        `;
      }
    }

    // Chú gà màu vàng đáng yêu
    function getChickenYellowSvg(flip = false) {
      return `
        <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow ${flip ? 'scale-x-[-1]' : ''}">
          <!-- Chân gà -->
          <path d="M44 78 L44 90 M44 90 L38 92 M44 90 L50 92" stroke="#F97316" stroke-width="3.5" stroke-linecap="round" />
          <path d="M58 78 L58 90 M58 90 L52 92 M58 90 L64 92" stroke="#F97316" stroke-width="3.5" stroke-linecap="round" />
          <!-- Đuôi gà -->
          <path d="M26 60 Q14 48 22 42 Q18 52 28 54" fill="#F59E0B" />
          <path d="M24 65 Q12 58 18 50" fill="#D97706" />
          <!-- Thân gà vàng -->
          <ellipse cx="48" cy="64" rx="22" ry="18" fill="#FACC15" stroke="#EAB308" stroke-width="1.8" />

          <path d="M38 60 Q48 52 56 62 Q48 72 38 60 Z" fill="#FDE047" stroke="#EAB308" stroke-width="1.5" />

          <path d="M52 20 Q55 10 60 18 Q65 10 68 18 Q73 12 72 22 Z" fill="#EF4444" />

          <circle cx="62" cy="36" r="17" fill="#FACC15" stroke="#EAB308" stroke-width="1.8" />

          <ellipse cx="75" cy="46" rx="3.5" ry="5" fill="#EF4444" />

          <polygon points="77,35 90,39 77,43" fill="#F97316" stroke="#EA580C" stroke-width="1" />

          <circle cx="67" cy="33" r="3.5" fill="#1E293B" />

    }

    // Chú gà màu đỏ khác biệt (Cả 2 cột dùng chung màu đỏ, ở vị trí số 1)
    function getChickenRedSvg(flip = false) {
      return `
        <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow ${flip ? 'scale-x-[-1]' : ''}">

          <!-- Đuôi gà -->
          <path d="M26 60 Q14 48 22 42 Q18 52 28 54" fill="#B91C1C" />
          <path d="M24 65 Q12 58 18 50" fill="#991B1B" />
          <!-- Thân gà đỏ -->
          <ellipse cx="48" cy="64" rx="22" ry="18" fill="#EF4444" stroke="#DC2626" stroke-width="1.8" />
          <!-- Cánh gà -->
          <path d="M38 60 Q48 52 56 62 Q48 72 38 60 Z" fill="#F87171" stroke="#DC2626" stroke-width="1.5" />
          <!-- Mào gà vàng nổi bật -->
          <path d="M52 20 Q55 10 60 18 Q65 10 68 18 Q73 12 72 22 Z" fill="#FACC15" />

          <circle cx="62" cy="36" r="17" fill="#EF4444" stroke="#DC2626" stroke-width="1.8" />
          <!-- Tích dưới mỏ -->
          <ellipse cx="75" cy="46" rx="3.5" ry="5" fill="#B91C1C" />
          <!-- Mỏ gà vàng -->
          <polygon points="77,35 90,39 77,43" fill="#FACC15" stroke="#EAB308" stroke-width="1" />
          <!-- Mắt tròn -->
          <circle cx="67" cy="33" r="3.5" fill="#1E293B" />
          <circle cx="68" cy="32" r="1.2" fill="#FFFFFF" />
          <!-- Má hồng sáng -->
          <circle cx="61" cy="41" r="3" fill="#FECDD3" opacity="0.9" />
        </svg>
      `;
    }

    // Chó đen khác màu (Cả 2 cột dùng chung cùng 1 màu đen, ở vị trí số 1)
    function getDogBlackSvg(flip = false) {
      return `
        <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow ${flip ? 'scale-x-[-1]' : ''}">
          <!-- Đuôi vẫy -->
          <path d="M26 68 Q14 55 20 46" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round" />
          <!-- Thân chó đen -->
          <ellipse cx="46" cy="68" rx="22" ry="17" fill="#334155" stroke="#0F172A" stroke-width="1.8" />
          <!-- Vòng cổ vàng -->
          <path d="M46 53 Q58 56 66 50" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
          <circle cx="62" cy="54" r="3" fill="#FEF08A" />
          <!-- Chân -->
          <rect x="34" y="78" width="8" height="10" rx="4" fill="#1E293B" />
          <rect x="54" y="78" width="8" height="10" rx="4" fill="#1E293B" />
          <!-- Tai rũ sau -->
          <ellipse cx="43" cy="36" rx="7" ry="15" transform="rotate(20 43 36)" fill="#0F172A" />

          <circle cx="60" cy="38" r="20" fill="#334155" stroke="#0F172A" stroke-width="1.8" />

          <ellipse cx="75" cy="38" rx="6.5" ry="14" transform="rotate(-15 75 38)" fill="#0F172A" />

          <ellipse cx="64" cy="44" rx="9" ry="7" fill="#475569" />

          <circle cx="55" cy="34" r="3.5" fill="#FFFFFF" />
          <circle cx="55.5" cy="34" r="2" fill="#0F172A" />
          <circle cx="69" cy="34" r="3.5" fill="#FFFFFF" />
          <circle cx="69.5" cy="34" r="2" fill="#0F172A" />
          <!-- Mũi & Lưỡi hồng -->
          <ellipse cx="64" cy="41" rx="3.5" ry="2.5" fill="#0F172A" />
          <path d="M59 46 Q64 50 69 46" fill="none" stroke="#0F172A" stroke-width="2" stroke-linecap="round" />

    // --- Xử lý Tương tác & Điểm số ---
    // Cập nhật điểm cho riêng từng cột (Không có nhãn chữ)
    function updateScoreForGroup(group, pointsToAdd) {
      if (group === 'duck') {
        scoreDuck1 += pointsToAdd;
        scoreTextDuck1.textContent = scoreDuck1;
        scoreBoxDuck1.classList.remove('score-pop');
        void scoreBoxDuck1.offsetWidth;
        scoreBoxDuck1.classList.add('score-pop');
      } else if (group === 'duckRight') {
        scoreDuck2 += pointsToAdd;
        scoreTextDuck2.textContent = scoreDuck2;
        scoreBoxDuck2.classList.remove('score-pop');
        void scoreBoxDuck2.offsetWidth;
        scoreBoxDuck2.classList.add('score-pop');
      }
    }

    // Hiệu ứng ngôi sao bay lên (+10 ⭐)
    function showFloatingScore(element) {
      const rect = element.getBoundingClientRect();
      const floater = document.createElement('div');
      floater.className = 'floating-score text-xl sm:text-2xl text-emerald-600 drop-shadow-md';
      floater.innerHTML = '+10 ⭐';
      floater.style.left = `${rect.left + rect.width / 2}px`;
      floater.style.top = `${rect.top}px`;
      document.body.appendChild(floater);
      setTimeout(() => floater.remove(), 950);
    }

    function clearSelectedHighlight() {
      document.querySelectorAll('.number-card').forEach(c => c.classList.remove('selected-ball'));
    }

    // Định dạng hiển thị đồng hồ MM:SS
    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    // Bắt đầu đếm ngược 3 phút
    function startGame() {
      sound.init();
      sound.playSelect();
      isGameActive = true;
      startOverlay.classList.add('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        startOverlay.style.display = 'none';
      }, 300);

      timerInterval = setInterval(() => {
        if (isGameFinished) return;
        remainingSeconds--;
        timerDisplay.textContent = formatTime(remainingSeconds);

        if (remainingSeconds <= 30) {
          timerBox.classList.remove('border-indigo-300', 'text-indigo-900');
          timerBox.classList.add('border-rose-500', 'text-rose-600', 'animate-pulse');
        }

        if (remainingSeconds <= 0) {
          clearInterval(timerInterval);
          finishAndEvaluateGame();
        }
      }, 1000);
    }

    // Kết thúc lượt làm bài (khi chọn hết 8 ô hoặc khi hết 3 phút): chấm điểm, hiện điểm và khóa tương tác
    function finishAndEvaluateGame() {
      if (isGameFinished) return;
      isGameFinished = true;
      isGameActive = false;
      if (timerInterval) clearInterval(timerInterval);
      timerBox.classList.remove('animate-pulse');

      selectedNumber = null;
      clearSelectedHighlight();

      // Hiện nút Sửa bài (✏️) cho cô giáo
      btnEditMode.classList.remove('hidden');

      // Hiện nút Vẽ (🖍️), Xóa (🧹) và Lời nhắc cho bé khoanh tròn
      btnPenMode.classList.remove('hidden');
      btnClearCanvas.classList.remove('hidden');
      drawInstruction.classList.remove('hidden');

      // Khóa kho số ở cột 2 cho tới khi cô giáo bấm nút Sửa bài
      document.querySelectorAll('.number-card').forEach(card => {
        card.setAttribute('draggable', 'false');
        card.classList.remove('cursor-grab', 'active:cursor-grabbing', 'hover:scale-110');
        card.classList.add('opacity-50', 'cursor-not-allowed');
      });

      evaluateAllZones();

      // Hiện điểm số của Cột 1 và Cột 3
      scoreBoxDuck1.classList.remove('invisible', 'opacity-0');
      scoreBoxDuck1.classList.add('score-pop');

      scoreBoxDuck2.classList.remove('invisible', 'opacity-0');
      scoreBoxDuck2.classList.add('score-pop');

      sound.playVictory();
    }

    // Hàm chấm điểm và cập nhật giao diện đúng/sai cho tất cả các ô
    function evaluateAllZones() {
      scoreDuck1 = 0;
      scoreDuck2 = 0;

      dropzones.forEach(zone => {
        if (!isTeacherEditMode) {
          zone.classList.remove('cursor-pointer', 'hover:bg-amber-100', 'hover:border-amber-500', 'hover:bg-teal-100', 'hover:border-teal-500');
          zone.classList.add('cursor-default');
        }

        const placed = zone.dataset.placedNumber;
        const correct = zone.dataset.correct;
        const group = zone.dataset.targetGroup;

        if (placed) {
          zone.classList.remove('opacity-60');
          const badge = zone.querySelector('.result-badge');
          if (placed === correct) {
            if (group === 'duck') scoreDuck1 += 10;
            if (group === 'duckRight') scoreDuck2 += 10;
            zone.classList.remove('border-dashed', 'border-amber-400', 'border-teal-400', 'border-rose-500', 'bg-rose-100/70');
            zone.classList.add('border-emerald-500', 'border-4', 'bg-emerald-100/70');
            if (badge) {
              badge.textContent = '✓';
              badge.className = 'result-badge absolute -top-2 -right-2 bg-emerald-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs font-black shadow border border-white';
            }
          } else {
            zone.classList.remove('border-dashed', 'border-amber-400', 'border-teal-400', 'border-emerald-500', 'bg-emerald-100/70');
            zone.classList.add('border-rose-500', 'border-4', 'bg-rose-100/70');
            if (badge) {
              badge.textContent = '✕';
              badge.className = 'result-badge absolute -top-2 -right-2 bg-rose-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs font-black shadow border border-white';
            }
          }
        } else {
          zone.classList.add('opacity-60');
        }
      });

      scoreTextDuck1.textContent = scoreDuck1;
      scoreTextDuck2.textContent = scoreDuck2;

      // Chỉ phóng to con thỏ trắng khác màu nếu cột đó trả lời đúng hoàn toàn (40/40 điểm)
      const specialLeft = document.getElementById('specialDuckLeft');
      if (specialLeft) {
        if (scoreDuck1 === 40) {
          specialLeft.classList.add('special-duck-zoomed');
        } else {
          specialLeft.classList.remove('special-duck-zoomed');
        }
      }

      const specialRight = document.getElementById('specialDuckRight');
      if (specialRight) {
        if (scoreDuck2 === 40) {
          specialRight.classList.add('special-duck-zoomed');
        } else {
          specialRight.classList.remove('special-duck-zoomed');
        }
      }
    }

    // Bật chế độ Sửa bài cho cô giáo chọn lại số khác
    function enableTeacherEditMode() {
      sound.init();
      sound.playSelect();
      isTeacherEditMode = true;

      // Tắt chế độ vẽ, ẩn công cụ vẽ và ẩn lời nhắc
      isDrawingMode = false;
      btnPenMode.classList.add('bg-blue-400', 'hover:bg-blue-500', 'hidden');
      btnPenMode.classList.remove('bg-blue-600', 'ring-4', 'ring-blue-300', 'scale-110');
      btnClearCanvas.classList.add('hidden');
      drawInstruction.classList.add('hidden');
      drawingCanvas.classList.add('pointer-events-none');
      drawingCanvas.classList.remove('pointer-events-auto');
      ctx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);

      // Đổi trạng thái nút Sửa bài sang đang hoạt động (màu xanh lá)
      btnEditMode.classList.remove('bg-amber-400', 'hover:bg-amber-500');
      btnEditMode.classList.add('bg-emerald-500', 'ring-4', 'ring-emerald-200', 'scale-110');

      // Mở khóa kho số ở cột 2 để cô giáo chọn lại
      document.querySelectorAll('.number-card').forEach(card => {
        card.setAttribute('draggable', 'true');
        card.classList.remove('opacity-50', 'cursor-not-allowed');
        card.classList.add('cursor-pointer', 'active:cursor-grabbing', 'hover:scale-110');
      });

      // Mở khóa lại các ô để nhận tương tác
      dropzones.forEach(zone => {
        zone.classList.remove('cursor-default', 'opacity-60');
        zone.classList.add('cursor-pointer');
      });
    }

    // Xử lý khi đặt số vào ô (Không cho chọn đáp án sai)
    function handleDropNumber(zone, placedNumber) {
      if (!isGameActive && !isTeacherEditMode) return;

      const correctNumber = zone.dataset.correct;

      // Không cho chọn đáp án sai: rung lắc, báo âm thanh sai và từ chối đặt vào ô
      if (placedNumber !== correctNumber) {
        sound.playWrong();
        zone.classList.remove('shake-animation', 'border-rose-500', 'bg-rose-100');
        void zone.offsetWidth;
        zone.classList.add('shake-animation', 'border-rose-500', 'bg-rose-100');
        setTimeout(() => {
          zone.classList.remove('shake-animation', 'border-rose-500', 'bg-rose-100');
        }, 450);
        selectedNumber = null;
        clearSelectedHighlight();
        return;
      }

      zone.dataset.placedNumber = placedNumber;
      zone.classList.remove('border-dashed');
      zone.classList.add('border-solid');

      zone.innerHTML = `
        <div class="w-full h-full rounded-full bg-gradient-to-br ${numberGradients[placedNumber]} text-white font-black text-2xl sm:text-3xl flex items-center justify-center shadow-lg relative transform scale-95 transition-all">
          ${placedNumber}
          <span class="result-badge hidden"></span>
        </div>
      `;

      selectedNumber = null;
      clearSelectedHighlight();

      sound.playScorePing();
      showFloatingScore(zone);

      // Nếu đang ở chế độ cô giáo sửa bài thì chấm lại ngay và cập nhật điểm
      if (isTeacherEditMode) {
        evaluateAllZones();
        return;
      }

      // Kiểm tra xem đã điền đủ cả 8 ô chưa
      const allFilled = Array.from(dropzones).every(z => z.dataset.placedNumber);
      if (allFilled) {
        setTimeout(() => {
          finishAndEvaluateGame();
        }, 300);
      }
    }

    // Sự kiện Dropzone
    dropzones.forEach(zone => {
      zone.addEventListener('pointerdown', (e) => {
        if (!isGameActive && !isTeacherEditMode) return;
        sound.init();
        if (selectedNumber) {
          e.preventDefault();
          handleDropNumber(zone, selectedNumber);
        }
      });

      zone.addEventListener('click', () => {
        if (!isGameActive && !isTeacherEditMode) return;
        sound.init();
        if (selectedNumber) {
          handleDropNumber(zone, selectedNumber);
        }
      });

      zone.addEventListener('dragover', (e) => {
        if (!isGameActive && !isTeacherEditMode) return;
        e.preventDefault();
        zone.classList.add('scale-105', 'bg-amber-100');
      });

      zone.addEventListener('dragleave', () => {
        zone.classList.remove('scale-105', 'bg-amber-100');
      });

      zone.addEventListener('drop', (e) => {
        if (!isGameActive && !isTeacherEditMode) return;
        e.preventDefault();
        zone.classList.remove('scale-105', 'bg-amber-100');
        const num = e.dataTransfer.getData('text/plain');
        if (num) {
          handleDropNumber(zone, num);
        }
      });
    });

    // Sự kiện nút Bắt đầu trên màn hình chờ
    btnStartGame.addEventListener('click', startGame);

    // Sự kiện nút Sửa bài cho cô giáo
    btnEditMode.addEventListener('click', enableTeacherEditMode);

    // Bật/tắt âm thanh
    const btnSoundToggle = document.getElementById('btnSoundToggle');
    const soundIcon = document.getElementById('soundIcon');
    btnSoundToggle.addEventListener('click', () => {
      sound.muted = !sound.muted;
      soundIcon.textContent = sound.muted ? '🔇' : '🔔';
    });

    window.onload = function() {
      renderAnimals();
      renderShuffledNumbers();
    };
  </script>
</body>
</html>
