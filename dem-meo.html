  <script>
    // --- Web Audio API cho hiệu ứng âm thanh phong phú ---
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playSelect() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(420, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(700, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }
      playScorePing() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        // Hợp âm ding-ding vui nhộn
        const now = this.ctx.currentTime;
        [587.33, 880, 1174.66].forEach((f, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, now + (i * 0.07));
          gain.gain.setValueAtTime(0.4, now + (i * 0.07));
          gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.07) + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + (i * 0.07));
          osc.stop(now + (i * 0.07) + 0.25);
        });
      }
      playWrong() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.linearRampToValueAtTime(140, now + 0.22);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.22);
      }
      playVictory() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        notes.forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freq;
          const startTime = this.ctx.currentTime + (i * 0.1);
          gain.gain.setValueAtTime(0.4, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.4);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(startTime);

    // Màu sắc gradient cho các quả bóng số 1 - 4

    // Xáo trộn ngẫu nhiên các số 1, 2, 3, 4
    function getShuffledNumbers() {
      const nums = ['1', '2', '3', '4'];
      for (let i = nums.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [nums[i], nums[j]] = [nums[j], nums[i]];
      }
      return nums;
    }

    // Tìm ô dropzone gần vị trí thả nhất (mở rộng vùng nhạy thêm 28px giúp bé thả dễ trúng)
    function findClosestDropzone(clientX, clientY) {
      const directEl = document.elementFromPoint(clientX, clientY);
      const directZone = directEl ? directEl.closest('.dropzone') : null;
      if (directZone) return directZone;

      let closestZone = null;
      let minDist = Infinity;
      const extraHitPadding = 28;

      dropzones.forEach(zone => {
        const rect = zone.getBoundingClientRect();
        if (
          clientX >= rect.left - extraHitPadding &&
          clientX <= rect.right + extraHitPadding &&
          clientY >= rect.top - extraHitPadding &&
          clientY <= rect.bottom + extraHitPadding
        ) {
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          const dist = Math.hypot(clientX - cx, clientY - cy);
          if (dist < minDist) {
            minDist = dist;
            closestZone = zone;
          }
        }
      });

      return closestZone;
    }

    function clearDropzoneHover() {
      dropzones.forEach(zone => zone.classList.remove('dropzone-hover'));
    }

    // Quản lý dọn dẹp phiên kéo thả đang chạy để không bao giờ bị kẹt nút
    let cleanupActiveNumberDrag = null;

    // Render các quả bóng số lộn xộn ở Cột 2 (Mở rộng vùng chạm toàn ô, bắt nhạy tức thì trên cả chuột và cảm ứng)
    function renderShuffledNumbers() {
      if (cleanupActiveNumberDrag) {
        cleanupActiveNumberDrag();
        cleanupActiveNumberDrag = null;
      }
      const shuffled = getShuffledNumbers();
      numberPool.innerHTML = '';
      shuffled.forEach(num => {
        // Nút bọc ngoài chiếm trọn vùng ô giúp chạm lệch viền vẫn ăn ngay

        slotBtn.type = 'button';
        slotBtn.draggable = false;
        slotBtn.dataset.number = num;
        slotBtn.className = 'number-slot flex-1 w-full min-h-[76px] sm:min-h-[92px] flex items-center justify-center p-1.5 sm:p-2 rounded-2xl bg-transparent cursor-pointer select-none focus:outline-none hover:bg-white/40 transition-colors duration-100';

        // Quả bóng số hiển thị ở chính giữa vùng chạm
        const ballEl = document.createElement('span');
        ballEl.dataset.number = num;
        ballEl.className = `number-card pointer-events-none shrink-0 w-16 h-16 sm:w-20 sm:h-20 p-0 m-0 rounded-full bg-gradient-to-br ${numberGradients[num]} text-white font-black text-3xl sm:text-4xl leading-none inline-flex items-center justify-center bubble-shadow border-4 select-none`;
        ballEl.textContent = num;

        slotBtn.appendChild(ballEl);

        // Chọn số tức thì ngay khi chạm/bấm xuống
        const selectBall = () => {
          if (!isGameActive && !isTeacherEditMode) return;
          sound.init();
          selectedNumber = num;
          clearSelectedHighlight();
          ballEl.classList.add('selected-ball');
          sound.playSelect();
        };

        slotBtn.addEventListener('pointerdown', (e) => {
          if (!isGameActive && !isTeacherEditMode) return;
          // Chỉ xử lý chuột trái hoặc chạm cảm ứng/bút
          if (e.pointerType === 'mouse' && e.button !== 0) return;

          e.preventDefault();
          if (cleanupActiveNumberDrag) {
            cleanupActiveNumberDrag();
          }

          // Luôn chọn số ngay lập tức ở thời điểm chạm
          selectBall();

          const activePointerId = e.pointerId;
          const startX = e.clientX;
          const startY = e.clientY;
          let isDragging = false;
          let dragGhost = null;
          let ghostHalfW = 0;
          let ghostHalfH = 0;

          const onPointerMove = (moveEvent) => {
            if (moveEvent.pointerId !== activePointerId) return;
            if (!isGameActive && !isTeacherEditMode) return;

            const dx = moveEvent.clientX - startX;
            const dy = moveEvent.clientY - startY;

            // Ngưỡng 10px giúp thao tác chạm nhẹ không bị nhầm thành kéo
            if (!isDragging && Math.hypot(dx, dy) > 10) {
              isDragging = true;
              const rect = ballEl.getBoundingClientRect();
              ghostHalfW = rect.width / 2;
              ghostHalfH = rect.height / 2;

              dragGhost = ballEl.cloneNode(true);
              dragGhost.classList.remove('selected-ball');
              dragGhost.style.position = 'fixed';
              dragGhost.style.width = `${rect.width}px`;
              dragGhost.style.height = `${rect.height}px`;
              dragGhost.style.margin = '0';
              dragGhost.style.padding = '0';
              dragGhost.style.transition = 'none';
              dragGhost.style.animation = 'none';
              dragGhost.style.pointerEvents = 'none';
              dragGhost.style.zIndex = '100';
              dragGhost.style.opacity = '0.94';
              dragGhost.style.left = `${moveEvent.clientX - ghostHalfW}px`;
              dragGhost.style.top = `${moveEvent.clientY - ghostHalfH}px`;
              dragGhost.style.transformOrigin = 'center center';
              dragGhost.style.transform = 'scale(1.08)';
              document.body.appendChild(dragGhost);
            }

            if (isDragging && dragGhost) {
              moveEvent.preventDefault();
              dragGhost.style.left = `${moveEvent.clientX - ghostHalfW}px`;
              dragGhost.style.top = `${moveEvent.clientY - ghostHalfH}px`;

              clearDropzoneHover();
              const hoveredZone = findClosestDropzone(moveEvent.clientX, moveEvent.clientY);
              if (hoveredZone && (!hoveredZone.dataset.placedNumber || isTeacherEditMode)) {
                hoveredZone.classList.add('dropzone-hover');
              }
            }
          };

          const cleanup = () => {
            window.removeEventListener('pointermove', onPointerMove);
            window.removeEventListener('pointerup', onPointerEnd);
            window.removeEventListener('pointercancel', onPointerEnd);
            window.removeEventListener('blur', cleanup);
            clearDropzoneHover();
            if (dragGhost) {
              dragGhost.remove();
              dragGhost = null;
            }
            if (cleanupActiveNumberDrag === cleanup) {
              cleanupActiveNumberDrag = null;
            }
          };

          const onPointerEnd = (endEvent) => {
            if (endEvent.pointerId !== activePointerId) return;
            const wasDragging = isDragging;
            const dropX = endEvent.clientX;
            const dropY = endEvent.clientY;
            cleanup();

            if (wasDragging) {
              const targetZone = findClosestDropzone(dropX, dropY);
              if (targetZone) {
                handleDropNumber(targetZone, num);
              }
            }
          };

          cleanupActiveNumberDrag = cleanup;
          window.addEventListener('pointermove', onPointerMove, { passive: false });
          window.addEventListener('pointerup', onPointerEnd);
          window.addEventListener('pointercancel', onPointerEnd);
          window.addEventListener('blur', cleanup);
        });

        numberPool.appendChild(slotBtn);
      });
    }

    // Render đàn mèo (3 mèo cam, 1 mèo hồng ở giữa) hoàn toàn không có chữ chú thích
    function renderAnimals() {

    // Đồng bộ kích thước 2 lớp canvas theo kích thước màn hình
    function resizeCanvases() {
      const dpr = window.devicePixelRatio || 1;
      const w = window.innerWidth;
      const h = window.innerHeight;

      [savedCanvas, drawCanvas].forEach(canvas => {
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        const ctx = canvas.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      });

      redrawSavedStrokes();
    }

    // Lấy khung chữ nhật hợp nhất bao quanh cả con heo màu hồng và ô số tương ứng của một cột
    function getPairBounds(group) {
      const pigEl = document.getElementById(group === 'duck' ? 'specialDuckLeft' : 'specialDuckRight');
      const numEl = document.querySelector(`.dropzone[data-target-group="${group}"][data-target-index="${specialDuckIdx}"]`);
      if (!pigEl || !numEl) return null;
      const pRect = pigEl.getBoundingClientRect();
      const nRect = numEl.getBoundingClientRect();
      const left = Math.min(pRect.left, nRect.left);
      const top = Math.min(pRect.top, nRect.top);
      const right = Math.max(pRect.right, nRect.right);
      const bottom = Math.max(pRect.bottom, nRect.bottom);
      return {
        pigEl,
        numEl,
        pRect,
        nRect,
        left,
        top,
        width: Math.max(1, right - left),
        height: Math.max(1, bottom - top)
      };
    }

    // Vẽ một nét bút mềm mại lên context
    function renderSmoothStroke(ctx, points, color = '#e11d48', lineWidth = 7) {
      if (!points || points.length < 2) return;
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.shadowColor = 'rgba(225, 29, 72, 0.25)';
      ctx.shadowBlur = 4;
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length - 1; i++) {
        const midX = (points[i].x + points[i + 1].x) / 2;
        const midY = (points[i].y + points[i + 1].y) / 2;
        ctx.quadraticCurveTo(points[i].x, points[i].y, midX, midY);
      }
      const last = points[points.length - 1];
      ctx.lineTo(last.x, last.y);
      ctx.stroke();
      ctx.restore();
    }

    // Vẽ lại tất cả các nét khoanh đúng đã được lưu
    function redrawSavedStrokes() {
      savedCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      savedStrokes.forEach(item => {
        const bounds = getPairBounds(item.group);
        if (!bounds) return;
        const mappedPoints = item.normPoints.map(pt => ({
          x: bounds.left + pt.nx * bounds.width,
          y: bounds.top + pt.ny * bounds.height
        }));
        renderSmoothStroke(savedCtx, mappedPoints, '#e11d48', 7);
      });
    }

    // Tạo vòng khoanh tròn SVG vẽ tay nổi bật
    function createCircleOverlay() {

                fill="none" stroke="#e11d48" stroke-width="7" stroke-linecap="round"
                class="animate-draw-circle" />
        </svg>
      `;
      return wrapper;
    }

    // Kích hoạt / tắt trạng thái cầm cây bút khoanh tròn
    function activatePen() {

    // Nhắc bé chọn cây bút nếu chưa cầm bút khi khoanh tròn
    function promptSelectPen() {

      void btnRedPen.offsetWidth;

    // Gắn sự kiện bấm chọn cây bút đỏ để bé tự cầm bút vẽ khoanh tròn (phản hồi tức thì bằng pointerdown)
    function setupRedPenControls() {
      btnRedPen.addEventListener('pointerdown', (e) => {

    // Kiểm tra điểm tâm của phần tử có nằm trong hộp bao nét vẽ hay không
    function isCenterInsideBox(rect, box, padding = 16) {
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      return (
        cx >= box.minX - padding &&
        cx <= box.maxX + padding &&
        cy >= box.minY - padding &&
        cy <= box.maxY + padding
      );
    }

    // Rung các phần tử sai nếu bé khoanh nhầm vào heo trắng hoặc ô số sai
    function shakeWrongElementsInBox(box) {
      let shookAny = false;
      document.querySelectorAll('.animal-card[data-is-special="false"]').forEach(card => {
        if (isCenterInsideBox(card.getBoundingClientRect(), box, 0)) {
          shookAny = true;
          card.classList.remove('shake-animation', 'ring-4', 'ring-rose-500', 'bg-rose-100');
          void card.offsetWidth;
          card.classList.add('shake-animation', 'ring-4', 'ring-rose-500', 'bg-rose-100');
          setTimeout(() => {
            card.classList.remove('shake-animation', 'ring-4', 'ring-rose-500', 'bg-rose-100');
          }, 450);
        }
      });
      dropzones.forEach(zone => {
        if (parseInt(zone.dataset.targetIndex, 10) !== specialDuckIdx && isCenterInsideBox(zone.getBoundingClientRect(), box, 0)) {
          shookAny = true;
          zone.classList.remove('shake-animation', 'border-rose-500', 'bg-rose-100');
          void zone.offsetWidth;
          zone.classList.add('shake-animation', 'border-rose-500', 'bg-rose-100');
          setTimeout(() => {
            zone.classList.remove('shake-animation', 'border-rose-500', 'bg-rose-100');
          }, 450);
        }
      });
      return shookAny;
    }

    // Đánh giá nét vẽ tự do của bé: phải khoanh trọn cả con heo màu hồng VÀ số tương ứng, không khoanh đáp án sai
    function evaluateDrawnCircle(points) {
      if (points.length < 8) {
        drawCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        return;
      }

      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      let pathLen = 0;
      for (let i = 0; i < points.length; i++) {
        const p = points[i];
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
        if (i > 0) {
          pathLen += Math.hypot(p.x - points[i - 1].x, p.y - points[i - 1].y);
        }
      }

      const box = { minX, maxX, minY, maxY };
      const boxW = maxX - minX;
      const boxH = maxY - minY;

      // Bỏ qua nếu nét vẽ quá nhỏ (chỉ chạm nhẹ)
      if (pathLen < 90 || boxW < 30 || boxH < 30) {
        drawCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        return;
      }

      // Kiểm tra xem nét vẽ có bao trùm nhầm con heo trắng hoặc số sai không
      let includesWrongItem = false;
      document.querySelectorAll('.animal-card[data-is-special="false"]').forEach(card => {
        if (isCenterInsideBox(card.getBoundingClientRect(), box, -6)) {
          includesWrongItem = true;
        }
      });
      dropzones.forEach(zone => {
        if (parseInt(zone.dataset.targetIndex, 10) !== specialDuckIdx && isCenterInsideBox(zone.getBoundingClientRect(), box, -6)) {
          includesWrongItem = true;
        }
      });

      let matchedGroup = null;
      if (!includesWrongItem && boxH >= 85) {
        for (const group of ['duck', 'duckRight']) {
          const alreadyDone = (group === 'duck')
            ? (circledState.duckPig && circledState.duckNum)
            : (circledState.duckRightPig && circledState.duckRightNum);
          if (alreadyDone) continue;

          const bounds = getPairBounds(group);
          if (!bounds) continue;

          const coversPig = isCenterInsideBox(bounds.pRect, box, 18);
          const coversNum = isCenterInsideBox(bounds.nRect, box, 18);

          if (coversPig && coversNum) {
            matchedGroup = group;
            break;
          }
        }
      }

      if (matchedGroup) {
        // Khoanh ĐÚNG cả con heo màu hồng và số tương ứng!
        const bounds = getPairBounds(matchedGroup);
        const normPoints = points.map(p => ({
          nx: (p.x - bounds.left) / bounds.width,
          ny: (p.y - bounds.top) / bounds.height
        }));
        savedStrokes.push({ group: matchedGroup, normPoints });
        redrawSavedStrokes();
        drawCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

        bounds.pigEl.dataset.circled = 'true';
        bounds.numEl.dataset.circled = 'true';

        if (matchedGroup === 'duck') {
          circledState.duckPig = true;
          circledState.duckNum = true;
        } else {
          circledState.duckRightPig = true;
          circledState.duckRightNum = true;
        }

        sound.playScorePing();
        showFloatingScore(bounds.pigEl);
        setTimeout(() => showFloatingScore(bounds.numEl), 120);

        if (isTeacherEditMode) {
          evaluateAllZones();
        } else {
          checkAllCompleted();
        }
      } else {
        // Khoanh sai hoặc chưa bao quanh đủ cả con heo màu hồng & số tương ứng -> báo sai và tự xóa nét
        sound.playWrong();
        shakeWrongElementsInBox(box);
        drawCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        renderSmoothStroke(drawCtx, points, 'rgba(244, 63, 94, 0.55)', 7);
        if (wrongStrokeTimer) clearTimeout(wrongStrokeTimer);
        wrongStrokeTimer = setTimeout(() => {
          drawCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        }, 450);
      }
    }

    // Thiết lập vẽ khoanh tròn tự do bằng chuột / ngón tay trên lớp drawCanvas
    function setupDrawingCanvas() {
      drawCanvas.addEventListener('pointerdown', (e) => {
        if (!isPenSelected || (!isGameActive && !isTeacherEditMode)) return;
        e.preventDefault();
        sound.init();
        if (wrongStrokeTimer) {
          clearTimeout(wrongStrokeTimer);
          wrongStrokeTimer = null;
        }
        drawCanvas.setPointerCapture(e.pointerId);
        isDrawing = true;
        currentStrokePoints = [{ x: e.clientX, y: e.clientY }];
        drawCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      });

      drawCanvas.addEventListener('pointermove', (e) => {
        if (!isDrawing) return;
        e.preventDefault();
        const last = currentStrokePoints[currentStrokePoints.length - 1];
        const dist = Math.hypot(e.clientX - last.x, e.clientY - last.y);
        if (dist >= 3) {
          currentStrokePoints.push({ x: e.clientX, y: e.clientY });
          drawCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
          renderSmoothStroke(drawCtx, currentStrokePoints, '#e11d48', 7);
        }
      });

      const finishDrawing = (e) => {
        if (!isDrawing) return;
        e.preventDefault();
        isDrawing = false;
        const strokeCopy = currentStrokePoints.slice();
        currentStrokePoints = [];
        evaluateDrawnCircle(strokeCopy);
      };

      drawCanvas.addEventListener('pointerup', finishDrawing);
      drawCanvas.addEventListener('pointercancel', finishDrawing);
    }

    // Gắn sự kiện nhắc bé bấm cầm cây bút nếu bé chạm vào heo khi đã vào bước khoanh tròn
    function attachAnimalCircleListeners() {
      document.querySelectorAll('.animal-card').forEach(card => {
        card.addEventListener('pointerdown', (e) => {
          if (!isGameActive && !isTeacherEditMode) return;
          if (!isCirclePhase) return;
          if (!isPenSelected) {
            e.preventDefault();
            promptSelectPen();
          }
        });
      });
    }

    // Xử lý nhắc bé cầm bút khi chạm vào ô số ở bước khoanh tròn
    function handleCircleNumber(zone) {
      if (!isCirclePhase && !isTeacherEditMode) return;
      if (!isPenSelected && !isTeacherEditMode) {
        promptSelectPen();
      }
    }

    // Kiểm tra xem bé đã điền đủ 8 số và khoanh tròn đủ cả 2 cột chưa
    function checkAllCompleted() {
      const allFilled = Array.from(dropzones).every(z => z.dataset.placedNumber);
      const allCircled = circledState.duckPig && circledState.duckNum && circledState.duckRightPig && circledState.duckRightNum;
      if (allFilled && allCircled) {
        setTimeout(() => {
          finishAndEvaluateGame();
        }, 500);
      }
    }

    // --- Xử lý Tương tác & Điểm số ---
    // Cập nhật điểm cho riêng từng cột (Không có nhãn chữ)
    function updateScoreForGroup(group, pointsToAdd) {
      if (group === 'duck') {
        scoreDuck1 += pointsToAdd;
        scoreTextDuck1.textContent = scoreDuck1;
        scoreBoxDuck1.classList.remove('score-pop');
        void scoreBoxDuck1.offsetWidth;
        scoreBoxDuck1.classList.add('score-pop');
      } else if (group === 'duckRight') {
        scoreDuck2 += pointsToAdd;
        scoreTextDuck2.textContent = scoreDuck2;
        scoreBoxDuck2.classList.remove('score-pop');
        void scoreBoxDuck2.offsetWidth;
        scoreBoxDuck2.classList.add('score-pop');
      }
    }

    // Hiệu ứng ngôi sao bay lên (+10 ⭐)
    function showFloatingScore(element) {
      const rect = element.getBoundingClientRect();
      const floater = document.createElement('div');
      floater.className = 'floating-score text-xl sm:text-2xl text-emerald-600 drop-shadow-md';
      floater.innerHTML = '+10 ⭐';
      floater.style.left = `${rect.left + rect.width / 2}px`;
      floater.style.top = `${rect.top}px`;
      document.body.appendChild(floater);
      setTimeout(() => floater.remove(), 950);
    }

    function clearSelectedHighlight() {
      document.querySelectorAll('.number-card').forEach(c => c.classList.remove('selected-ball'));
    }

    // Định dạng hiển thị đồng hồ MM:SS
    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    // Bắt đầu đếm ngược 3 phút
    function startGame() {
      sound.init();
      sound.playSelect();
      isGameActive = true;
      startOverlay.classList.add('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        startOverlay.style.display = 'none';
      }, 300);

      timerInterval = setInterval(() => {
        if (isGameFinished) return;
        remainingSeconds--;
        timerDisplay.textContent = formatTime(remainingSeconds);

        if (remainingSeconds <= 30) {
          timerBox.classList.remove('border-indigo-300', 'text-indigo-900');
          timerBox.classList.add('border-rose-500', 'text-rose-600', 'animate-pulse');
        }

        if (remainingSeconds <= 0) {
          clearInterval(timerInterval);
          finishAndEvaluateGame();
        }
      }, 1000);
    }

    // Kết thúc lượt làm bài (khi chọn hết 8 ô hoặc khi hết 3 phút): chấm điểm, hiện điểm và khóa tương tác
    function finishAndEvaluateGame() {
      if (isGameFinished) return;
      isGameFinished = true;
      isGameActive = false;
      if (timerInterval) clearInterval(timerInterval);
      timerBox.classList.remove('animate-pulse');

      selectedNumber = null;
      clearSelectedHighlight();
      deactivatePen();

      // Hiện nút Sửa bài (✏️) cho cô giáo
      btnEditMode.classList.remove('hidden');

      // Ẩn gợi ý khoanh tròn khi kết thúc
      circleModeHint.classList.add('hidden');
      circleModeHint.classList.remove('flex');
      numberPool.classList.remove('hidden');

      // Khóa kho số ở cột 2 cho tới khi cô giáo bấm nút Sửa bài
      document.querySelectorAll('.number-slot').forEach(slot => {
        slot.classList.remove('cursor-pointer', 'hover:bg-white/40');
        slot.classList.add('cursor-not-allowed');
      });
      document.querySelectorAll('.number-card').forEach(card => {
        card.classList.add('opacity-50');
      });

      evaluateAllZones();

      // Hiện điểm số của Cột 1 và Cột 3
      scoreBoxDuck1.classList.remove('invisible', 'opacity-0');
      scoreBoxDuck1.classList.add('score-pop');

      scoreBoxDuck2.classList.remove('invisible', 'opacity-0');
      scoreBoxDuck2.classList.add('score-pop');

      sound.playVictory();
    }

    // Hàm chấm điểm và cập nhật giao diện đúng/sai cho tất cả các ô
    function evaluateAllZones() {
      scoreDuck1 = 0;
      scoreDuck2 = 0;

      dropzones.forEach(zone => {
        if (!isTeacherEditMode) {
          zone.classList.remove('cursor-pointer', 'hover:bg-amber-100', 'hover:border-amber-500', 'hover:bg-teal-100', 'hover:border-teal-500');
          zone.classList.add('cursor-default');
        }

        const placed = zone.dataset.placedNumber;
        const correct = zone.dataset.correct;
        const group = zone.dataset.targetGroup;

        if (placed) {
          zone.classList.remove('opacity-60');
          const badge = zone.querySelector('.result-badge');
          if (placed === correct) {
            if (group === 'duck') scoreDuck1 += 10;
            if (group === 'duckRight') scoreDuck2 += 10;
            zone.classList.remove('border-dashed', 'border-amber-400', 'border-teal-400', 'border-rose-500', 'bg-rose-100/70');
            zone.classList.add('border-emerald-500', 'border-4', 'bg-emerald-100/70');
            if (badge) {
              badge.textContent = '✓';
              badge.className = 'result-badge absolute -top-2 -right-2 bg-emerald-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs font-black shadow border border-white';
            }
          } else {
            zone.classList.remove('border-dashed', 'border-amber-400', 'border-teal-400', 'border-emerald-500', 'bg-emerald-100/70');
            zone.classList.add('border-rose-500', 'border-4', 'bg-rose-100/70');
            if (badge) {
              badge.textContent = '✕';
              badge.className = 'result-badge absolute -top-2 -right-2 bg-rose-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs font-black shadow border border-white';
            }
          }
        } else {
          zone.classList.add('opacity-60');
        }
      });

      // Cộng điểm khoanh tròn heo màu hồng và số tương ứng
      if (circledState.duckPig) scoreDuck1 += 10;
      if (circledState.duckNum) scoreDuck1 += 10;
      if (circledState.duckRightPig) scoreDuck2 += 10;
      if (circledState.duckRightNum) scoreDuck2 += 10;

      scoreTextDuck1.textContent = scoreDuck1;
      scoreTextDuck2.textContent = scoreDuck2;

      // Chỉ phóng to con heo màu hồng nếu cột đó hoàn thành đúng toàn bộ (60/60 điểm)
      const specialLeft = document.getElementById('specialDuckLeft');
      if (specialLeft) {
        if (scoreDuck1 === 60) {
          specialLeft.classList.add('special-duck-zoomed');
        } else {
          specialLeft.classList.remove('special-duck-zoomed');
        }
      }

      const specialRight = document.getElementById('specialDuckRight');
      if (specialRight) {
        if (scoreDuck2 === 60) {
          specialRight.classList.add('special-duck-zoomed');
        } else {
          specialRight.classList.remove('special-duck-zoomed');
        }
      }
    }

    // Bật chế độ Sửa bài cho cô giáo chọn lại số khác
    function enableTeacherEditMode() {
      sound.init();
      sound.playSelect();
      isTeacherEditMode = true;

      // Đổi trạng thái nút Sửa bài sang đang hoạt động (màu xanh lá)
      btnEditMode.classList.remove('bg-amber-400', 'hover:bg-amber-500');
      btnEditMode.classList.add('bg-emerald-500', 'ring-4', 'ring-emerald-200', 'scale-110');

      // Mở khóa kho số ở cột 2 để cô giáo chọn lại
      document.querySelectorAll('.number-slot').forEach(slot => {
        slot.classList.remove('cursor-not-allowed');
        slot.classList.add('cursor-pointer', 'hover:bg-white/40');
      });
      document.querySelectorAll('.number-card').forEach(card => {
        card.classList.remove('opacity-50');
      });

      // Mở khóa lại các ô để nhận tương tác
      dropzones.forEach(zone => {
        zone.classList.remove('cursor-default', 'opacity-60');
        zone.classList.add('cursor-pointer');
      });

      // Nếu còn cột chưa khoanh tròn thì hiện lại cây bút đỏ cho cô giáo
      if (!(circledState.duckPig && circledState.duckNum && circledState.duckRightPig && circledState.duckRightNum)) {
        circleModeHint.classList.remove('hidden');
        circleModeHint.classList.add('flex');
      }
    }

    // Xử lý khi đặt số vào ô (Không cho chọn đáp án sai)
    function handleDropNumber(zone, placedNumber) {
      if (!isGameActive && !isTeacherEditMode) return;

      const correctNumber = zone.dataset.correct;

      // Không cho chọn đáp án sai: rung lắc, báo âm thanh sai và từ chối đặt vào ô
      if (placedNumber !== correctNumber) {
        sound.playWrong();
        zone.classList.remove('shake-animation', 'border-rose-500', 'bg-rose-100');
        void zone.offsetWidth;
        zone.classList.add('shake-animation', 'border-rose-500', 'bg-rose-100');
        setTimeout(() => {
          zone.classList.remove('shake-animation', 'border-rose-500', 'bg-rose-100');
        }, 450);
        selectedNumber = null;
        clearSelectedHighlight();
        return;
      }

      zone.dataset.placedNumber = placedNumber;
      zone.classList.remove('border-dashed');
      zone.classList.add('border-solid');

      zone.innerHTML = `
        <div class="w-full h-full rounded-full bg-gradient-to-br ${numberGradients[placedNumber]} text-white font-black text-2xl sm:text-3xl flex items-center justify-center shadow-lg relative transform scale-95 transition-all">
          ${placedNumber}
          <span class="result-badge hidden"></span>
        </div>
      `;

      // Giữ lại vòng khoanh tròn nếu ô này đã được khoanh trước đó
      if (zone.dataset.circled === 'true') {
        zone.appendChild(createCircleOverlay());
      }

      selectedNumber = null;
      clearSelectedHighlight();

      sound.playScorePing();
      showFloatingScore(zone);

      // Nếu đang ở chế độ cô giáo sửa bài thì chấm lại ngay và cập nhật điểm
      if (isTeacherEditMode) {
        evaluateAllZones();
        return;
      }

      // Kiểm tra xem đã điền đủ cả 8 ô chưa
      const allFilled = Array.from(dropzones).every(z => z.dataset.placedNumber);
      if (allFilled) {
        isCirclePhase = true;
        numberPool.classList.add('hidden');
        circleModeHint.classList.remove('hidden');
        circleModeHint.classList.add('flex');
        checkAllCompleted();
      }
    }

    // Sự kiện Dropzone
    dropzones.forEach(zone => {
      zone.addEventListener('pointerdown', (e) => {
        if (!isGameActive && !isTeacherEditMode) return;
        sound.init();
        if (selectedNumber && !zone.dataset.placedNumber) {
          e.preventDefault();
          handleDropNumber(zone, selectedNumber);
        } else if (zone.dataset.placedNumber && !selectedNumber) {
          e.preventDefault();
          handleCircleNumber(zone);
        } else if (selectedNumber && isTeacherEditMode) {
          e.preventDefault();
          handleDropNumber(zone, selectedNumber);
        }
      });

      zone.addEventListener('dragover', (e) => {
        if (!isGameActive && !isTeacherEditMode) return;
        e.preventDefault();
        zone.classList.add('scale-105', 'bg-amber-100');
      });

      zone.addEventListener('dragleave', () => {
        zone.classList.remove('scale-105', 'bg-amber-100');
      });

      zone.addEventListener('drop', (e) => {
        if (!isGameActive && !isTeacherEditMode) return;
        e.preventDefault();
        zone.classList.remove('scale-105', 'bg-amber-100');
        const payload = e.dataTransfer.getData('text/plain');
        if (payload === 'RED_PEN') {
          handleCircleNumber(zone);
          return;
        }
        const droppedNum = payload || selectedNumber;
        if (droppedNum) {
          handleDropNumber(zone, droppedNum);
        }
      });
    });

    // Sự kiện nút Bắt đầu trên màn hình chờ (phản hồi tức thì)
    btnStartGame.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      startGame();
    });

    // Sự kiện nút Sửa bài cho cô giáo (phản hồi tức thì)
    btnEditMode.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      enableTeacherEditMode();
    });

    // Bật/tắt âm thanh (phản hồi tức thì)
    const btnSoundToggle = document.getElementById('btnSoundToggle');
    const soundIcon = document.getElementById('soundIcon');
    btnSoundToggle.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      sound.muted = !sound.muted;
      soundIcon.textContent = sound.muted ? '🔇' : '🔔';
    });

    window.onload = function() {
      renderAnimals();
      renderShuffledNumbers();
      setupRedPenControls();
      setupDrawingCanvas();
      resizeCanvases();
      window.addEventListener('resize', resizeCanvases);
    };
  </script>
